name: Deploy to GitHub Pages

on:
  # Trigger the workflow every time you push to the `main` branch
  # Using a different branch name? Replace `main` with your branch's name
  push:
    branches:
      - main
  # Allows you to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:
  
# Allow this job to clone the repo and create a page deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    env:
      DATABASE_URL: "file:./tracker.db"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v4.1.1
      - name: Download tracker.db from Releases
        run: |-
          curl -fsSL --retry 3 -H "Authorization: token ${{ github.token }}" -H "Accept: application/octet-stream" \
            -o astro-pl-tracker/prisma/tracker.db \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/db-latest/tracker.db"
          ls -la astro-pl-tracker/prisma/tracker.db
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
      - name: Install dependencies and build site
        run: |-
          pnpm install
          pnpm run build
        working-directory: ./astro-pl-tracker
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: astro-pl-tracker/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4.0.5