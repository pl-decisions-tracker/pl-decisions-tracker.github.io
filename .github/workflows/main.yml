# This is a basic workflow to help you get started with Actions

name: UPDATE data files daily

# Controls when the workflow will run
on:
  schedule:
  # 21:23 UTC to avoid the top-of-the-hour congestion on GitHub Actions;
  # runs at :00 are frequently delayed or silently dropped.
  - cron: "23 21 * * *"
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Allow this job to clone the repo and create a page deployment
permissions:
  contents: write
  pages: write
  id-token: write

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # # This workflow contains a single job called "build"
  # json-update:
  #   # The type of runner that the job will run on
  #   runs-on: ubuntu-latest

  #   # Steps represent a sequence of tasks that will be executed as part of the job
  #   steps:
  #   # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
  #   - uses: actions/checkout@v3

  #   # Runs a set of commands using the runners shell
  #   # We need %2C${current_date} in order by to overcome agressive API caching
  #   - name: update json files
  #     run: |
  #       source update-files.sh

  #   - name: Commit and push changes
  #     run: |-
  #       git fetch origin
  #       git pull origin main
  #       git diff
  #       git config user.name "Automated"
  #       git config user.email "---"
  #       git diff --quiet || (git add -A && git commit -m "Updated with latest")
  #       git push


  sqliteupdate:
    runs-on: ubuntu-latest
    outputs:
      update_failed: ${{ steps.updater.outputs.update_failed }}
      failure_code: ${{ steps.updater.outputs.failure_code }}
      failure_message: ${{ steps.updater.outputs.failure_message }}
      failure_data: ${{ steps.updater.outputs.failure_data }}
    steps:
    - uses: actions/checkout@v4

    - name: Download tracker.db from Releases
      run: |-
        curl -fsSL --retry 3 -H "Authorization: token ${{ github.token }}" -H "Accept: application/octet-stream" \
          -o astro-pl-tracker/prisma/tracker.db \
          "https://github.com/${GITHUB_REPOSITORY}/releases/download/db-latest/tracker.db"
        ls -la astro-pl-tracker/prisma/tracker.db

    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24

    - uses: pnpm/action-setup@v4
      name: Install pnpm
      id: pnpm-install
      with:
        version: 11
        run_install: false

    - name: Get pnpm store directory
      id: pnpm-cache
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

    - uses: actions/cache@v4
      name: Setup pnpm cache
      with:
        path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - name: Install dependencies
      run: pnpm install

    - name: Run sql updater
      id: updater
      run: pnpm exec zx updater.mjs

    - name: Upload updated tracker.db to Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |-
        if [ "${{ steps.updater.outputs.update_failed }}" = "1" ]; then
          echo "Updater reported failure; keeping previous tracker.db asset untouched";
          exit 0;
        fi
        gh release view db-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
          gh release create db-latest --repo "$GITHUB_REPOSITORY" --title "tracker.db storage" --notes "Automated tracker.db storage (updated daily by CI)"
        gh release upload db-latest astro-pl-tracker/prisma/tracker.db --clobber --repo "$GITHUB_REPOSITORY"

    - name: Commit and push changes
      run: |-
        git fetch origin
        git pull origin main
        git diff
        git config user.name "Automated"
        git config user.email "---"
        git diff --quiet || (git add -A && git commit -m "Updated with latest")
        git push

  build:
    needs: sqliteupdate
    env:
      DATABASE_URL: "file:./tracker.db"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v4.1.1
        with:
          ref: 'main'
      - name: Download tracker.db from Releases
        run: |-
          curl -fsSL --retry 3 -H "Authorization: token ${{ github.token }}" -H "Accept: application/octet-stream" \
            -o astro-pl-tracker/prisma/tracker.db \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/db-latest/tracker.db"
          ls -la astro-pl-tracker/prisma/tracker.db
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
      - name: Install dependencies and build site
        run: |-
          pnpm install
          pnpm run build
        working-directory: ./astro-pl-tracker
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: astro-pl-tracker/dist

  deploy:
    needs:
      - build
      - sqliteupdate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4.0.5
      - name: Check updater status
        env:
          UPDATE_FAILED: ${{needs.sqliteupdate.outputs.update_failed}}
          FAILURE_CODE: ${{needs.sqliteupdate.outputs.failure_code}}
          FAILURE_MESSAGE: ${{needs.sqliteupdate.outputs.failure_message}}
          FAILURE_DATA: ${{needs.sqliteupdate.outputs.failure_data}}
        run : |-
          if [ "$UPDATE_FAILED" = "1" ]; then
            echo "Update failed, failing the whole pipeline";
            echo "Failre code: ${FAILURE_CODE}";
            echo "Failre message: ${FAILURE_MESSAGE}";
            echo "Failre data: ${FAILURE_DATA}";
            exit 1;
          fi